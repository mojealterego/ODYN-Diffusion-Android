name: Android ARM64 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android host
        shell: bash
        run: |
          set -euo pipefail
          host=android/app/src/main/kotlin/com/mojealterego/odyn_diffusion_android/MainActivity.kt
          cp "$host" /tmp/odyn-MainActivity.kt
          flutter create --platforms=android --org com.mojealterego --project-name odyn_diffusion_android .
          mkdir -p "$(dirname "$host")"
          cp /tmp/odyn-MainActivity.kt "$host"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localization
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze lib test
      - name: Unit and widget tests
        run: flutter test
      - name: Build Android ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: odyn-arm64-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
