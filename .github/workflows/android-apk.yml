name: Android ARM64 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android CMake and NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Bootstrap, test and build Android ARM64
        run: bash scripts/bootstrap_build_android.sh
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: odyn-arm64-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
